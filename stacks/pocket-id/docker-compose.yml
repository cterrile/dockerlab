services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    container_name: pocket-id
    restart: unless-stopped
    networks:
      - pangolin
    environment:
      APP_URL: https://pocket-id.${DOMAIN}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
      # Pangolin terminates TLS and forwards HTTP.
      TRUST_PROXY: "true"
      PUID: 1000
      PGID: 1000
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      # Pangolin blueprint (public resource) — see https://docs.pangolin.net/manage/blueprints
      - pangolin.public-resources.pocket-id.name=pocket-id
      - pangolin.public-resources.pocket-id.full-domain=pocket-id.${DOMAIN}
      - pangolin.public-resources.pocket-id.protocol=http
      - pangolin.public-resources.pocket-id.targets[0].hostname=pocket-id
      - pangolin.public-resources.pocket-id.targets[0].port=1411
      - pangolin.public-resources.pocket-id.targets[0].path=/
      - pangolin.public-resources.pocket-id.targets[0].method=http

networks:
  pangolin:
    external: true

volumes:
  pocket-id-data:
    external: true
