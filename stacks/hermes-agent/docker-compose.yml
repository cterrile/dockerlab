x-hermes-image: &hermes-image
  build:
    context: .
    dockerfile: Dockerfile
  image: hermes-agent-opencode:latest

services:
  hermes:
    <<: *hermes-image
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ~/.hermes:/opt/data
    networks:
      - hermes-net
      - pangolin
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    labels:
      # Pangolin blueprint (public resource) — see https://docs.pangolin.net/manage/blueprints
      - pangolin.public-resources.hermes.name=hermes
      - pangolin.public-resources.hermes.full-domain=hermes.${DOMAIN}
      - pangolin.public-resources.hermes.protocol=http
      - pangolin.public-resources.hermes.targets[0].hostname=hermes
      - pangolin.public-resources.hermes.targets[0].port=9119
      - pangolin.public-resources.hermes.targets[0].path=/
      - pangolin.public-resources.hermes.targets[0].method=http
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  mission-control:
    image: ghcr.io/builderz-labs/mission-control:latest
    container_name: mission-control
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_GATEWAY_OPTIONAL=true
      # Uncomment to connect to the hermes gateway directly:
      # - OPENCLAW_GATEWAY_HOST=hermes
      # - OPENCLAW_GATEWAY_PORT=8642
    volumes:
      - mc-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  mc-data:

networks:
  pangolin:
    external: true
  hermes-net:
    driver: bridge
