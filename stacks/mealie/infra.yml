host: artemis
deploy_path: /home/deploy/dockerlab/stacks/mealie
env_file: true
secrets:
  - DOMAIN
  - MEALIE_DB_PASSWORD
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_USER
  - SMTP_PASSWORD
  - OPENAI_BASE_URL
