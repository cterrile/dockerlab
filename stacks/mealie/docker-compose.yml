services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: always
    networks:
      - mealie
      - pangolin
    ports:
      - "9925:9000" # 
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - mealie-data:/app/data/
    environment:
      # Set ENV Variables Here
      ALLOW_SIGNUP: false
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://cookbook.${DOMAIN}
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
      POSTGRES_SERVER: mealie-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # Email Settings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH_STRATEGY: 'NONE'
      SMTP_FROM_NAME: Mealie
      SMTP_FROM_EMAIL: cookbook@${DOMAIN}
      # OpenID Connect (Pocket ID)
      OIDC_AUTH_ENABLED: "true"
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://pocket-id.${DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${MEALIE_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_NAME: Pocket ID
      OIDC_ADMIN_GROUP: admin
      OIDC_REMEMBER_ME: "true"
      # OpenAI Settings (Using custom provider)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: zai-org/GLM-5.3
      OPENAI_AUDIO_MODEL: openai/whisper-large-v3
    depends_on:
      mealie-db:
        condition: service_healthy
    labels:
      # Pangolin blueprint (public resource) — see https://docs.pangolin.net/manage/blueprints
      - pangolin.public-resources.mealie.name=mealie
      - pangolin.public-resources.mealie.full-domain=cookbook.${DOMAIN}
      - pangolin.public-resources.mealie.protocol=http
      - pangolin.public-resources.mealie.targets[0].hostname=mealie
      - pangolin.public-resources.mealie.targets[0].port=9000
      - pangolin.public-resources.mealie.targets[0].path=/
      - pangolin.public-resources.mealie.targets[0].method=http

  mealie-mcp:
    build: .
    image: mealie-mcp:local
    container_name: mealie-mcp
    restart: always
    depends_on:
      - mealie
    networks:
      - mealie
      - pangolin
    volumes:
      - mealie-mcp-data:/data
    environment:
      MEALIE_URL: http://mealie:9000
      PUBLIC_URL: https://mealie-mcp.${DOMAIN}
      POCKET_ID_ISSUER: https://pocket-id.${DOMAIN}
      POCKET_ID_CLIENT_ID: ${MEALIE_MCP_POCKET_ID_CLIENT_ID}
      POCKET_ID_CLIENT_SECRET: ${MEALIE_MCP_POCKET_ID_CLIENT_SECRET}
      MCP_DATA_DIR: /data
    labels:
      # Pangolin blueprint (public resource) — see https://docs.pangolin.net/manage/blueprints
      - pangolin.public-resources.mealie-mcp.name=mealie-mcp
      - pangolin.public-resources.mealie-mcp.full-domain=mealie-mcp.${DOMAIN}
      - pangolin.public-resources.mealie-mcp.protocol=http
      - pangolin.public-resources.mealie-mcp.targets[0].hostname=mealie-mcp
      - pangolin.public-resources.mealie-mcp.targets[0].port=8000
      - pangolin.public-resources.mealie-mcp.targets[0].path=/
      - pangolin.public-resources.mealie-mcp.targets[0].method=http

  mealie-db:
    container_name: mealie-postgres
    image: postgres:15.19
    restart: always
    networks:
      - mealie
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
      POSTGRES_USER: mealie
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3



volumes:
  mealie-data:
    external: true
  mealie-pgdata:
    external: true
  mealie-mcp-data:
    external: true

networks:
  pangolin:
    external: true
  mealie:
    driver: bridge