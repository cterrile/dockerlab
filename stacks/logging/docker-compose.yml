services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:3.80
    container_name: seaweedfs-master
    restart: unless-stopped
    command: "master -ip=seaweedfs-master -mdir=/data -defaultReplication=000"
    volumes:
      - seaweedfs-master-data:/data
    networks:
      - logging-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.80
    container_name: seaweedfs-volume
    restart: unless-stopped
    depends_on:
      - seaweedfs-master
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8080 -dir=/data"
    volumes:
      - seaweedfs-volume-data:/data
    networks:
      - logging-net

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.80
    container_name: seaweedfs-filer
    restart: unless-stopped
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer"
    networks:
      - logging-net

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.80
    container_name: seaweedfs-s3
    restart: unless-stopped
    depends_on:
      - seaweedfs-filer
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "loki",
              "credentials": [
                {
                  "accessKey": "$${SEAWEEDFS_ACCESS_KEY}",
                  "secretKey": "$${SEAWEEDFS_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write"]
            }
          ]
        }
        EOF
        exec weed s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -config=/etc/seaweedfs/s3.json
    networks:
      - logging-net

  seaweedfs-init:
    image: amazon/aws-cli:2.22.35
    container_name: seaweedfs-init
    restart: "no"
    depends_on:
      - seaweedfs-s3
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -euc
      - |
        until aws --endpoint-url http://seaweedfs-s3:8333 s3 ls >/dev/null 2>&1; do
          echo "Waiting for SeaweedFS S3..."
          sleep 2
        done
        aws --endpoint-url http://seaweedfs-s3:8333 s3 mb s3://loki-data || true
        aws --endpoint-url http://seaweedfs-s3:8333 s3 mb s3://loki-ruler || true
        echo "SeaweedFS buckets ready"
    networks:
      - logging-net

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - logging-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  loki-ingest:
    image: nginx:1.27-alpine
    container_name: loki-ingest
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      LOKI_INGEST_USER: ${LOKI_INGEST_USER}
      LOKI_INGEST_PASSWORD: ${LOKI_INGEST_PASSWORD}
      DOMAIN: ${DOMAIN}
    entrypoint:
      - sh
      - -euc
      - |
        apk add --no-cache apache2-utils >/dev/null
        htpasswd -bc /etc/nginx/.htpasswd "$${LOKI_INGEST_USER}" "$${LOKI_INGEST_PASSWORD}"
        cat > /etc/nginx/nginx.conf <<'NGINX'
        events { worker_connections 1024; }
        http {
          server {
            listen 8080;
            location = /loki/api/v1/push {
              auth_basic "Loki Ingest";
              auth_basic_user_file /etc/nginx/.htpasswd;
              proxy_pass http://loki:3100;
              proxy_set_header Host $$host;
              client_max_body_size 10m;
            }
            location = /health {
              return 200 'OK';
              auth_basic off;
            }
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
    networks:
      - logging-net
      - pangolin
    labels:
      - pangolin.public-resources.loki-ingest.name=loki-ingest
      - pangolin.public-resources.loki-ingest.full-domain=loki-ingest.${DOMAIN}
      - pangolin.public-resources.loki-ingest.protocol=http
      - pangolin.public-resources.loki-ingest.targets[0].hostname=loki-ingest
      - pangolin.public-resources.loki-ingest.targets[0].port=8080
      - pangolin.public-resources.loki-ingest.targets[0].path=/
      - pangolin.public-resources.loki-ingest.targets[0].method=http

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://logs.${DOMAIN}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - logging-net
      - pangolin
    labels:
      - pangolin.public-resources.logs.name=logs
      - pangolin.public-resources.logs.full-domain=logs.${DOMAIN}
      - pangolin.public-resources.logs.protocol=http
      - pangolin.public-resources.logs.targets[0].hostname=grafana
      - pangolin.public-resources.logs.targets[0].port=3000
      - pangolin.public-resources.logs.targets[0].path=/
      - pangolin.public-resources.logs.targets[0].method=http
      - glance.category=homelab
      - glance.hide=false
      - glance.name=Logs
      - glance.icon=di:grafana
      - glance.url=https://logs.${DOMAIN}
      - glance.description=Centralized container logs

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: logging-alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - logging-net

networks:
  logging-net:
    driver: bridge
  pangolin:
    external: true

volumes:
  seaweedfs-master-data:
    name: logging-seaweedfs-master-data
    external: true
  seaweedfs-volume-data:
    name: logging-seaweedfs-volume-data
    external: true
  loki-data:
    name: logging-loki-data
    external: true
  grafana-data:
    name: logging-grafana-data
    external: true
