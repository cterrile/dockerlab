services:
  monica:
    image: monica:4.1.2-apache
    container_name: monica
    restart: unless-stopped
    depends_on:
      monica-db:
        condition: service_healthy
    networks:
      - monica
      - pangolin
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://crm.${DOMAIN}
      APP_KEY: ${MONICA_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: monica-db
      DB_PORT: 3306
      DB_DATABASE: monica
      DB_USERNAME: monica
      DB_PASSWORD: ${MONICA_DB_PASSWORD}
      DB_USE_UTF8MB4: "true"
      APP_DISABLE_SIGNUP: ${MONICA_APP_DISABLE_SIGNUP:-false}
    volumes:
      - monica-data:/var/www/html/storage
    labels:
      # Pangolin blueprint (public resource) — see https://docs.pangolin.net/manage/blueprints
      - pangolin.public-resources.crm.name=crm
      - pangolin.public-resources.crm.full-domain=crm.${DOMAIN}
      - pangolin.public-resources.crm.protocol=http
      - pangolin.public-resources.crm.targets[0].hostname=monica
      - pangolin.public-resources.crm.targets[0].port=80
      - pangolin.public-resources.crm.targets[0].path=/
      - pangolin.public-resources.crm.targets[0].method=http

  monica-db:
    image: mariadb:11
    container_name: monica-db
    restart: unless-stopped
    networks:
      - monica
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: monica
      MYSQL_USER: monica
      MYSQL_PASSWORD: ${MONICA_DB_PASSWORD}
    volumes:
      - monica-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  monica-data:
    external: true
  monica-mariadb:
    external: true

networks:
  pangolin:
    external: true
  monica:
    driver: bridge
