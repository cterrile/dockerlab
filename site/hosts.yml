# Site tools registry — which hosts receive scripts/ + site/ via push-tools.
#
# Per-host secrets use the same keys as site/docker-compose.yml. Store values in
# Infisical prod under infisical_path (default: /sites/<hostname>).
#
# Required Infisical secrets for stacks/logging (path: /stacks/logging in prod):
#   DOMAIN, GRAFANA_ADMIN_PASSWORD, SEAWEEDFS_ACCESS_KEY, SEAWEEDFS_SECRET_KEY,
#   LOKI_INGEST_USER, LOKI_INGEST_PASSWORD
#
# Create SeaweedFS credentials with: openssl rand -hex 16 (access) and openssl rand -hex 32 (secret)
hosts:
  artemis:
    scripts_path: /home/deploy/dockerlab/scripts
    site_path: /home/deploy/dockerlab/site
    infisical_path: /sites/artemis
    secrets:
      - PANGOLIN_ENDPOINT
      - NEWT_ID
      - NEWT_SECRET
      - PORTAINER_EDGE_ID
      - PORTAINER_EDGE_KEY

  icarus:
    scripts_path: /home/deploy/dockerlab/scripts
    site_path: /home/deploy/dockerlab/site
    infisical_path: /sites/icarus
    compose_profiles: remote-logging
    secrets:
      - PANGOLIN_ENDPOINT
      - NEWT_ID
      - NEWT_SECRET
      - PORTAINER_EDGE_ID
      - PORTAINER_EDGE_KEY
      - LOG_HOST_NAME
      - LOKI_INGEST_URL
      - LOKI_INGEST_USER
      - LOKI_INGEST_PASSWORD

  gaia:
    scripts_path: /home/deploy/dockerlab/scripts
    site_path: /home/deploy/dockerlab/site
    infisical_path: /sites/gaia
    compose_profiles: remote-logging
    secrets:
      - PANGOLIN_ENDPOINT
      - NEWT_ID
      - NEWT_SECRET
      - PORTAINER_EDGE_ID
      - PORTAINER_EDGE_KEY
      - LOG_HOST_NAME
      - LOKI_INGEST_URL
      - LOKI_INGEST_USER
      - LOKI_INGEST_PASSWORD
