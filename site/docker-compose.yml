services:
  newt:
    image: fosrl/newt:1.11.0
    container_name: newt-edge-client
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pangolin
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
      - DOCKER_SOCKET=/var/run/docker.sock

  portainer_edge_agent:
    image: portainer/agent:latest
    container_name: portainer-edge-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - EDGE=1
      - EDGE_ID=${PORTAINER_EDGE_ID}
      - EDGE_KEY=${PORTAINER_EDGE_KEY}

  # VPS-only remote log collector — enable with COMPOSE_PROFILES=remote-logging
  alloy-remote:
    profiles: ["remote-logging"]
    image: grafana/alloy:v1.10.0
    container_name: alloy-remote
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-remote.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      LOG_HOST_NAME: ${LOG_HOST_NAME}
      LOKI_INGEST_URL: ${LOKI_INGEST_URL}
      LOKI_INGEST_USER: ${LOKI_INGEST_USER}
      LOKI_INGEST_PASSWORD: ${LOKI_INGEST_PASSWORD}

networks:
  pangolin:
    external: true
